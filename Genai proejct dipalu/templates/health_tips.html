<!DOCTYPE html>
<html>
<head>
    <title>Health Tips - Medical Assistant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Daily Health Tips 💡</h1>
        
        <ul class="nav nav-pills mb-4 justify-content-center">
            <li class="nav-item">
                <a class="nav-link" href="/">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/report-analysis">Report Analysis</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/medical-chat">Medical Chat</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="/health-tips">Health Tips</a>
            </li>
        </ul>
        
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card mb-4">
                    <div class="card-header">Today's Health Tips</div>
                    <div class="card-body">
                        <div id="tips-content">
                            {{ tips|safe }}
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">BMI Calculator</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="weight" class="form-label">Weight (kg)</label>
                                <input type="number" class="form-control" id="weight" min="0" step="0.1" value="70">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="height" class="form-label">Height (m)</label>
                                <input type="number" class="form-control" id="height" min="0" step="0.01" value="1.70">
                            </div>
                        </div>
                        <button id="calculate-bmi" class="btn btn-primary">Calculate BMI</button>
                        
                        <div id="bmi-result" class="mt-3" style="display: none;">
                            <div class="alert alert-info">
                                <h5 id="bmi-value"></h5>
                                <div id="bmi-interpretation"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('calculate-bmi').addEventListener('click', function() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            
            if (isNaN(weight) || isNaN(height) || weight <= 0 || height <= 0) {
                alert('Please enter valid weight and height values');
                return;
            }
            
            fetch('/calculate-bmi', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ weight: weight, height: height }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }
                
                document.getElementById('bmi-value').textContent = `Your BMI is: ${data.bmi}`;
                document.getElementById('bmi-interpretation').innerHTML = data.interpretation;
                document.getElementById('bmi-result').style.display = 'block';
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error calculating BMI. Please try again.');
            });
        });
    </script>
</body>
</html>
